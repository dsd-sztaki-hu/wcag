   <h4>Névben szereplő címke</h4>
   <p class="conformance-level">A</p>
	
  <p>Azoknál a <a>felhasználói felület-elem</a>eknél, amelyek <a>címkéje</a> <a>szöveg</a>et vagy <a>képként reprezentált szöveg</a>et foglal magába, a <a>név</a> tartalmazza a vizuálisan megjelenített szöveget.
  </p>

  <p class="note">Bevett gyakorlat a címke szövegét a név elején feltünteni.
  </p>
	
</section>
