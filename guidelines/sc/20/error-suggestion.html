   <p class="conformance-level">AA</p>
   
   <p> Amennyiben egy <a>beviteli hiba</a> automatikusan kerül detektálásra, és a javítási megoldások ismertek, akkor a megoldási javaslatokat a felhasználók rendelkezésére bocsájtják, hacsak ez nem veszélyezteti a tartalom biztonságát vagy célját.
